    <div class="main" id="mainContent">

    <script>
        // ============================================================
        // 数据：全部13套试卷（含课程归属）
        // 字段说明：t=题目文本, o=选项数组, a=答案, p=解析, course=所属课程
        // ============================================================
        var allPapers = {

            // ---- 视听语言（9套） ----
            "2018.04真题": {
                course: "视听语言",
                sections: [
                    { key: "single", label: "一、单项选择题（共5题）", questions: [
                        { t: "什么是构成视听语言的基本单位？", o: ["A.拍摄","B.剪辑","C.镜头","D.组接"], a: "C.镜头", p: "构成视听语言的基本单位是镜头。" },
                        { t: "摄像机被放在主要被摄体的水平视点，与人眼相同高度的拍摄角度是", o: ["A.平拍角度","B.仰角度","C.俯拍角度","D.主观视角"], a: "A.平拍角度" },
                        { t: "由被摄对象的视线和关系所形成的轴线叫做", o: ["A.视线轴线","B.关系轴线","C.人物轴线","D.对角轴线"], a: "B.关系轴线" },
                        { t: "除了对白和音乐之外电影中所有声音的统称为", o: ["A.拟声","B.同期声","C.动效","D.旁白"], a: "C.动效" },
                        { t: "什么调度是电影场面调度的基础，是电影场面调度内在的依托？", o: ["A.镜头调度","B.演员调度","C.对比调度","D.平面调度"], a: "B.演员调度" }
                    ]},
                    { key: "multi", label: "二、多项选择题（共5题）", questions: [
                        { t: "动画的文学性叙事方式主要有以下哪几种文体的性质？", o: ["A.诗歌","B.小说","C.神话","D.童话","E.记叙文"], a: "A、B" },
                        { t: "景别可以具体划分为以下几种？", o: ["A.全景","B.中景","C.特写","D.大特写","E.大全景"], a: "A、B、C、D、E" },
                        { t: "把一个连贯动作的两个不同片段组接在一起时，要考虑以下哪些匹配？", o: ["A.人物的匹配","B.大小的匹配","C.位置的匹配","D.运动的匹配","E.视线的匹配"], a: "C、D、E" },
                        { t: "音乐录音主要有", o: ["A.直接录音","B.间接录音","C.先期录音","D.后期录音","E.混合录音"], a: "C、D、E" },
                        { t: "剪辑涉及到镜头之间的时间空间关系时，通常要进行时空的哪几种处理？", o: ["A.时空的压缩处理","B.时空的跳跃处理","C.时空的延伸处理","D.时空的方向处理","E.时空的旋转处理"], a: "A、B、C、D" }
                    ]},
                    { key: "short", label: "三、简答题（共4题）", questions: [
                        { t: "简述推镜头和拉镜头的区别。", a: "推镜头是摄像机向拍摄目标定向移动或变焦使景别由大变小，拉镜头则相反。推镜头使观众和拍摄对象的距离变近，拉镜头则变远。" },
                        { t: "简述几种常用的跃轴方法。", a: "一、利用主体的运动越轴；二、用主观镜头越轴；三、利用运动镜头越轴；四、利用中性镜头越轴。" },
                        { t: "简要概括剪辑创作过程有哪些步骤。", a: "获取、整理、回看和筛选、顺片、粗剪、精剪、图像锁定、生成母版和交付。" },
                        { t: "影院动画片相比电视动画片主要有哪些不同？", a: "传播媒介不同，时长不同，画面质量要求不同，制作成本不同。" }
                    ]},
                    { key: "essay", label: "四、论述题（共2题）", questions: [
                        { t: "请简要论述常规的三人对话的拍摄方法。", a: "(1)先用一个交代镜头交代全体；(2)用内反拍角度重点表现其中的某一个演员；(3)用内反拍角度拍摄另外两个人；(4)用外反拍角度拍摄一个演员；(5)回到总角镜头。" },
                        { t: "请你谈谈如何进行声音的主观运用。", a: "(1)将现实中的声音加以夸张、歪曲、变形，表现人物的精神状态；(2)用现实中或非现实中的声音，揭示人物的思维和内心世界；(3)将某种声音与画面并列，以象征、隐喻事物的性质。" }
                    ]},
                    { key: "fill", label: "五、填空题（共11题）", questions: [
                        { t: "实验动画片包含两个含义：上的实验和方面的探索。", a: "形式；内涵" },
                        { t: "是指腋部或两肩以上人物的头像或者其他使主体景物细部占满画面的景别。", a: "特写" },
                        { t: "移动镜头按移动方向大致可分为移动和移动。", a: "横向；纵向" },
                        { t: "由被摄对象的运动方向构成的轴线叫做", a: "运动轴线" },
                        { t: "来自于戏剧舞台，属于戏剧性的场面调度。", a: "平面场面调度" },
                        { t: "剪辑创作的内容，首先是组的组接。", a: "镜头" },
                        { t: "电影的录音一般包括和三个部分。", a: "对白、音效、音乐" },
                        { t: "将运动典型部分拍下来，往往要比只用一个镜头拍下整个运动更生动，更有趣味。", a: "由若干片段" },
                        { t: "镜头场面调度主要依靠和运动。", a: "景别" },
                        { t: "镜头构图中的细微差别，摄像机的稍稍推进或摄制方向的微小变动，在银幕上都会被看成是", a: "跳跃" },
                        { t: "善于表现人、物，观众能够在镜头中详细地观察被拍摄的对象，而不必受到各种其他运动因素的干扰。", a: "固定摄影" }
                    ]},
                    { key: "name", label: "六、名词解释（共4题）", questions: [
                        { t: "视听语言", a: "视听语言主要是电影的艺术手段，同时也是大众传媒中的一种符号编码系统。作为一种独特的艺术形态，主要内容包括：镜头、镜头的拍摄、镜头的组接和音画关系。" },
                        { t: "大全景", a: "表现十分广阔的场面、大范围的背景。" },
                        { t: "俯拍角度", a: "就是说拍摄的视角在物体上方，严格地讲甚至是正上方。" },
                        { t: "演员调度", a: "指导演通过演员的运动方向、所处位置的更动以及演员与演员之间发生交流时的动态与静态的变化等，造成画面的不同造型、不同景别，揭示人物关系及其情绪的变化，以获得银幕效果。" }
                    ]}
                ]
            },

            "2018.10真题": {
                course: "视听语言",
                sections: [
                    { key: "fill", label: "一、填空题（共15题）", questions: [
                        { t: "作为一种独特的艺术形态，视听语言的主要内容包括：镜头、镜头的拍摄、镜头的组接和__________。", a: "声画关系" },
                        { t: "追述动画发展的历史，应该说动画的技艺是从开始的，因为这种类型的动画片只在学术研讨会或者电影节展示，所以有人称其为", a: "实验动画；实验动画片" },
                        { t: "中国唐朝发明的，是一种由幕后投射光源的影子戏，在17世纪曾被引入巡回演出，风靡一时。", a: "皮影戏" },
                        { t: "构成视听语言的基本单位是，作为电影创作的实践术语，一个镜头是指摄影机的一次拍摄。", a: "镜头；连续不断" },
                        { t: "在电影中有一个非常明显的现象：镜头越被摄主体，场景越窄，而越远离被摄主体，场景越宽。取景的直接影响电影画面的容量。", a: "接近；距离" },
                        { t: "镜头的摄影方法大致分为和两种。", a: "运动和静止" },
                        { t: "轴线是在的转换中制约变化范围的界限。", a: "镜头；视角" },
                        { t: "场面调度是使用的基本的首要的手段，目的是把的涵义和情感内容传达给观众，赋予剧情以美学形式。", a: "导演；剧情" },
                        { t: "场面调度的方法多种多样，没有固定的模式，常见的有场面调度、重复性场面调度、场面调度、象征性场面调度等。", a: "纵深；对比性" },
                        { t: "剪辑创作的内容，首先就是镜头的另一个内容是改动结构、压缩片长，形成影片，最后是剪辑音响效果。", a: "组接；节奏" },
                        { t: "拼剪是用来补教画面的不足。", a: "拼接；长度" },
                        { t: "动作剪接技巧有、静接静、动接静。", a: "动接动；静接动" },
                        { t: "场面调度的依据主要是提供的内容，作者描述的与心理活动，人物之间的矛盾，人物与环境的关系等。", a: "剧本；人物性格" },
                        { t: "电影录音一般包括音效、三个部分。", a: "对白、音乐" },
                        { t: "音画关系指音乐与画面在影片中的结合关系，一般分为和两种形式。", a: "音画同步和音画对位" }
                    ]},
                    { key: "short", label: "二、简答题（共1题）", questions: [
                        { t: "请用文字分析在双人对话场面中轴线的三角形原理及双人对话的典型机位及其拍摄角度。", a: "三角形原理：两个中心演员间的关系轴线以他们相互视线的走向为基础。在关系线一侧可有三个顶端位置。这三个顶端构成一个底边与关系线平行的三角形。典型机位：反拍角度、内反拍角度、齐轴镜头、平行镜头、90度拍摄、直线型拍摄。" }
                    ]}
                ]
            },

            "2019.04真题": {
                course: "视听语言",

                        { t: "__________是影片总节奏的最后组成部分。", a: "剪辑节奏" },
                        { t: "寻找和选择__________，是电影剪辑工作主要内容之一。", a: "剪辑点" },
                        { t: "__________是除了对白和音乐之外电影中所有声音的统称。", a: "音响" }
                    ]},
                    { key: "name", label: "二、名词解释（共2题）", questions: [
                        { t: "镜头", a: "镜头是影视作品中最基本的构成单位，指摄影机从开机到关机连续拍摄的一段画面。它不仅是一个物理或技术概念，更是叙事、表意和营造氛围的基本元素。镜头可通过景别、角度、运动、焦距等变化，传达不同的视觉信息和情感效果。" },
                        { t: "场面调度", a: "场面调度指导演对场景中各种视觉元素的安排与控制，包括演员的位置、动作、走位（演员调度）和摄影机的运动、角度、景别等（镜头调度）。其目的是通过空间、运动与时间的组织，增强叙事的表现力、戏剧张力和视觉美感。" }
                    ]},
                    { key: "essay", label: "三、论述题（共2题）", questions: [
                        { t: "举例简述一场戏如何开始的几种常用方式。", a: "1.动作切入：以人物的动作直接开始，迅速进入情节。例如：《谍影重重》中常以主角的快速行动开场。\n2.对话开场：以人物对话引入场景，通过语言交代背景或冲突。例如：《低俗小说》中咖啡馆对话直接引出剧情。\n3.环境展示：先展示场景环境，营造氛围，再引入人物。例如：《闪灵》中汽车驶向酒店的航拍镜头，营造孤寂压抑感。\n4.声音先行：先出现声音（如音乐、音响、旁白），再出现画面。例如：《现代启示录》以风扇声和旁白开场，暗示战争与迷失。\n5.特写引入：以局部特写开始，引起好奇，再逐步揭示全貌。例如：《这个杀手不太冷》以杯子、牛奶等特写暗示人物性格与关系。\n6.闪回或插叙：以回忆或倒叙方式开始，设置悬念。例如：《公民凯恩》以玫瑰花蕾悬念开场。" },
                        { t: "简述剪辑工作内容。", a: "1.素材整理与筛选：观看所有拍摄素材，进行场记、分类、标记，选择可用镜头。\n2.粗剪：按剧本顺序拼接镜头，形成初步叙事框架，确定基本节奏与结构。\n3.精剪：在粗剪基础上调整镜头顺序、时长、转场，细化节奏，强化情感与戏剧效果。\n4.剪辑点选择：寻找动作、情绪、节奏的最佳切换点，保证视觉流畅与心理连贯。\n5.声音剪辑：对白、音乐、音响的同步、调整与混合，增强声音的表现力与层次感。\n6.特效与调色：配合视觉特效、颜色校正，统一画面风格，提升视觉质感。\n7.节奏控制：通过镜头长短、切换频率、动静对比等手段控制影片整体节奏。\n8.叙事与情感强化：通过剪辑手法（如平行蒙太奇、交叉剪辑）强化剧情张力与人物情感。\n9.最终合成与输出：完成所有音画同步、格式转换，输出成片。" }
                    ]}
                ]
            },

            "2026.04真题": {
                course: "视听语言",
                sections: [
                    { key: "fill", label: "一、填空题（共10题）", questions: [
                        { t: "视听语言主要是电影的艺术手段，同时也是__________中一种符号编码系统。", a: "电视（或：影视/新媒体）" },
                        { t: "实验动画片包括两个意义：__________和内涵方面的探索。", a: "形式方面" },
                        { t: "镜头与镜头连接后形成的逻辑关系才是视听语言用以__________的重要手段。", a: "叙述故事、表达思想" },
                        { t: "__________是电影区别于其他造型艺术的独特表现手段，是视听语言的独特表达方式，也是电影作为一门独立艺术的重要标志之一。", a: "蒙太奇" },

                        { t: "镜头场面调度主要依靠景别和__________。", a: "运动" },
                        { t: "__________是电影艺术特有的表现手段，贯穿在影片的全部创作过程中，始于电影文学剧本和导演构思，最后落实在剪辑台上。", a: "剪辑（或：蒙太奇）" },
                        { t: "__________是人物形体动作剪辑技法之一。", a: "动作衔接（或：动作接续）" },
                        { t: "__________指声音形象脱离画面的限制，呈现出主观的感受或者表明导演的主观意图，这是电影中运用声音的一种创作手法。", a: "主观声音（或：声音的主观化）" }
                    ]},
                    { key: "name", label: "二、名词解释（共2题）", questions: [
                        { t: "全景深", a: "全景深是指镜头中从最近点到最远点都保持清晰焦点的画面效果。通过使用小光圈、短焦距镜头或特殊拍摄技术，使前景、中景、背景同时清晰，常用于表现空间深度和复杂场面布局，让观众自由选择视觉焦点。" },
                        { t: "音乐转场剪辑", a: "音乐转场剪辑是指利用音乐的节奏、旋律或情绪的延续与变化，实现不同镜头或场景之间的转换的剪辑手法。可以通过音乐的重音、渐弱、渐强、突然中断或延续等方式，平滑地连接前后画面，增强叙事连贯性和情绪一致性。" }
                    ]},
                    { key: "essay", label: "三、论述题（共2题）", questions: [
                        { t: "简述纵深场面调度与镜头焦距的关系。", a: "（一）纵深场面调度的概念：在镜头纵深方向（从前景到背景）上安排演员和物体运动，利用空间层次增强画面的立体感和叙事深度。\n（二）与镜头焦距的关系：短焦距（广角）景深大，透视感强，增强纵深视觉效果，使前后景距离感明显扩大，有利于展示复杂的纵深调度；标准焦距接近人眼视角，纵深调度效果自然真实；长焦距（望远）景深小，压缩空间，减弱纵深层次感。\n（三）具体分析：1.广角镜头配合纵深调度，可突出人物之间的距离感和空间层次，增强画面张力（如《公民凯恩》中的景深镜头）；2.利用光圈控制景深，小光圈加大景深，使纵深调度中的前后人物都清晰，大光圈虚化背景；3.焦点变化（跟焦）可引导观众视线在纵深调度中移动；4.导演常根据纵深深度的要求选择相应焦距。\n结论：纵深场面调度与镜头焦距相互制约、相互配合。" },
                        { t: "简述电影音乐的作用。", a: "（一）渲染气氛，营造情绪：通过音乐的节奏、调性、音色等元素，为画面营造特定的情绪氛围。例：恐怖片中的尖锐音效、爱情片中的抒情旋律。\n（二）刻画人物心理：音乐可表现角色的内心世界，揭示无法用台词表达的情感。例：主角内心挣扎时使用不和谐音。\n（三）推动情节发展：音乐的快慢、强弱变化可与剧情节奏同步，增强悬念或高潮。例：追逐场面使用快速节奏音乐。\n（四）连接场景过渡（转场）：利用音乐的延续或变化实现不同镜头、场景之间的平滑过渡。例：音乐持续跨越多个场景，保持情绪连贯。\n（五）强化主题，形成记忆点：主题音乐反复出现，强化影片的整体风格和辨识度。例：《星球大战》《泰坦尼克号》的主题曲。\n（六）补充画面信息，暗示剧情：音乐可以提供画面之外的信息，铺垫后续情节。例：悬念镜头前出现不祥音调，预示危险。\n（七）创造节奏，控制观影心理：音乐的快慢、强弱可调节观众的紧张或松弛感。例：利用音乐渐快制造紧张，突然静止制造冲击。\n结论：电影音乐不仅是画面的附属品，更是叙事的重要组成部分。" }
                    ]}
                ]
            },

            "视听语言B卷模拟试题": {

                sections: [
                    { key: "single", label: "一、单项选择题（共15题）", questions: [
                        { t: "中国美术电影诞生于20世纪20年代初，在上海由“万氏兄弟”拍摄了中国最早的一批动画片，其中影响较大的是长片（）。", o: ["A.《花木兰》","B.《大闹天宫》","C.《铁扇公主》","D.《葫芦娃》"], a: "C.《铁扇公主》" },
                        { t: "轴线是（）。", o: ["A.在镜头中的界线","B.制约视角变化的界线","C.在镜头的转换中制约视角变化的界线","D.制约在镜头中视线转变的界线"], a: "C.在镜头的转换中制约视角变化的界线" },
                        { t: "中国电影的诞生于（）。", o: ["A.1895年","B.1891年","C.1905年","D.1904年"], a: "C.1905年" },
                        { t: "一束平行光通过镜头时，在光轴上汇聚一点称为（）。", o: ["A.焦距","B.焦点","C.主体","D.焦点距离"], a: "B.焦点" },
                        { t: "（）是指镜头的机位不变，景物会有上下左右移动位置。", o: ["A.移动镜头","B.推动镜头","C.移动背景","D.推动背景"], a: "C.移动背景" },
                        { t: "1906年（）制作了世界上第一部动画片《滑稽脸的幽默相》。", o: ["A.爱迪生","B.布雷克顿","C.埃米尔·科尔","D.温瑟·麦凯"], a: "B.布雷克顿" },
                        { t: "摇镜头的定义是（）。", o: ["A.以摄影机为中心，向四周进行扇形拍摄","B.以摄影机为中心，向四周六面空间进行扇形或环形拍摄","C.以摄影机为中心，向四周空间进行环形拍摄","D.以上都不对"], a: "B.以摄影机为中心，向四周六面空间进行扇形或环形拍摄" },
                        { t: "下列哪位人物绘制了人类历史上第一部动画片《一只小鹿》？（）", o: ["A.温瑟·麦凯","B.布雷克顿","C.埃米尔·雷诺","D.宫崎骏"], a: "C.埃米尔·雷诺" },
                        { t: "能看到物体顶部的角度是（）。", o: ["A.俯视","B.仰视","C.平视","D.侧视"], a: "A.俯视" },
                        { t: "电影艺术所特有的表现手段和最突出的形式特点是（）。", o: ["A.画面","B.声音","C.色彩","D.蒙太奇"], a: "D.蒙太奇" },
                        { t: "轴线规则指的是摄影机安排在轴线的（）以内。", o: ["A.360度","B.90度","C.180度","D.270度"], a: "C.180度" },
                        { t: "摄影机镜头与画面逐渐的远离，画面外框逐渐变大，画面内的景物逐渐增多，这种镜头运动的方法叫（）。", o: ["A.推镜头","B.拉镜头","C.摇镜头","D.跟镜头"], a: "B.拉镜头" },
                        { t: "以下类型不属于画面拍摄角度的是（）。", o: ["A.几何角度","B.客观角度","C.主观角度","D.拍摄角度"], a: "D.拍摄角度" },
                        { t: "苏联早期电影中，吉加·维尔托夫、列夫·库里肖夫、谢尔盖·爱森斯坦、普多夫金等人创建和发展的“蒙太奇”理论通称为（）。", o: ["A.日本蒙太奇","B.韩国蒙太奇","C.美国蒙太奇","D.苏联蒙太奇"], a: "D.苏联蒙太奇" },
                        { t: "不属于场面调度基本类型的是（）。", o: ["A.机器调度","B.人物调度","C.镜头调度","D.人物和镜头综合调度"], a: "A.机器调度" }
                    ]},
                    { key: "fill", label: "二、填空题（共10空）", questions: [
                        { t: "中国第一部水墨动画片是__________。", a: "《小蝌蚪找妈妈》" },
                        { t: "1895年12月28日，__________在一家咖啡馆里首次公开放映了《工厂大门》、《火车进站》等影片，这一天在电影史上被确认为电影诞生之日。", a: "卢米埃尔兄弟" },
                        { t: "19世纪以前，人类的传播媒介从媒介材料上区分，大体可以分为两类：身体媒介和__________。", a: "体外媒介" },
                        { t: "1928年迪士尼推出以米老鼠为主角的卡通动画__________，这是第一部音画同步的有声卡通片。", a: "《威利号汽船》" },
                        { t: "__________，也称“关键动画”，是指根据分镜头设计或画面设计稿将设计好的镜头影像绘制成精细的线条稿，是动画制作具体操作过程中最重要的部分，包括整个镜头内部动作和外部动作设计。", a: "原画" },
                        { t: "以透视效果的不同来区分三种镜头，短焦距镜头、标准焦距镜头、__________。", a: "长焦距镜头" },
                        { t: "__________又称局部镜头、叙事镜头。景别往往以中景及近景系列（中近景、近景、特写、大特写）为主。", a: "近景" },
                        { t: "任何一种光线都存在着四个要素：强度、__________、方向和色调。", a: "性质" },
                        { t: "电影的运动主要由两方面组成：被摄对象的运动、__________。", a: "摄影机的运动" },
                        { t: "电影中人物之间进行交流的声音称之为__________。", a: "对白" }
                    ]},
                    { key: "name", label: "四、名词解释（共5题）", questions: [
                        { t: "色调", a: "色调是指画面中色彩的整体倾向和基调，通过色彩的明度、纯度和色相的组合，营造出特定的情感氛围和视觉风格。" },
                        { t: "音响", a: "音响是影视作品中除语言和音乐以外的所有声音的总称，包括环境音响、动作音响等，用于增强真实感和表现力。" },
                        { t: "场面调度", a: "场面调度指导演对画框内一切视觉元素的安排和组织，包括演员的走位、摄影机的运动以及场景布置等。" },
                        { t: "广角镜头", a: "广角镜头是指焦距较短、视角较宽的镜头，能够拍摄更广阔的场景，并增强画面的透视感和空间纵深感。" },
                        { t: "长镜头", a: "长镜头是指在一个连续的镜头中，通过较长的拍摄时间完整地记录一个场景或事件，保持时空的完整性，具有纪实性。" }
                    ]},
                    { key: "short", label: "五、简答题（共5题）", questions: [
                        { t: "简述景别的意义。", a: "①描绘电影空间：展示环境、规模及人物与环境的关系。②建立情感距离：控制观众与人物之间的心理距离（如特写让人亲近，远景让人疏远）。③建构视觉风格：导演对景别的偏好和使用方式是形成其独特视觉风格的重要组成部分。" },
                        { t: "简述光线的作用。", a: "①照明作用：使被摄物体清晰可见。②造型作用：塑造物体的立体感和质感。③营造氛围：通过光线的明暗、色彩和方向，传达特定的情绪和气氛。④引导视线：利用光线的分布引导观众的注意力。" },
                        { t: "简述色调在电影中的作用。", a: "①营造特定氛围：如暖色调传递温馨，冷色调传递压抑。②象征意义：色彩可象征情感或主题（如红色代表热情或危险）。③统一视觉风格：色调的统一增强影片的整体感和艺术性。" },
                        { t: "简述人声在电影中的作用。", a: "①对白：传递信息，塑造人物性格。②独白：揭示人物内心世界。③旁白：提供客观叙述或背景信息。④人声的节奏和语气能增强戏剧性和真实感。" },
                        { t: "简述剪辑的内容。", a: "①镜头的取舍：选择使用哪些镜头。②确定镜头的长度：控制每个镜头的持续时间以调整节奏。③选择剪辑点：确定切换的精确时刻，保证动作、情绪或节奏的连贯。④处理声画关系：协调声音与画面的同步或对位。" }
                    ]},
                    { key: "essay", label: "六、论述题（共2题）", questions: [
                        { t: "以实例论述音乐在电影中的作用。", a: "音乐在电影中的作用包括：①渲染气氛，营造情绪（如《大白鲨》的紧张配乐）。②刻画人物心理（如《海上钢琴师》中钢琴曲表现主角的内心）。③推动情节发展（如《星球大战》的主题曲伴随剧情高潮）。④连接场景过渡（如音乐持续跨越多场景）。⑤强化主题（如《泰坦尼克号》的主题曲成为记忆点）。⑥补充画面信息，暗示剧情（如不祥音调预示危险）。⑦创造节奏，控制观众心理。通过实例具体分析。" },
                        { t: "结合实例论述电影中的蒙太奇。", a: "蒙太奇是电影通过镜头的组合产生新意义的剪辑手法。其类型包括：①叙事蒙太奇（如连续性剪辑推进故事）；②表现蒙太奇（如对比、隐喻、心理蒙太奇）。实例分析：爱森斯坦《战舰波将金号》中的“敖德萨阶梯”段落，通过快速切换的镜头，造成强烈的节奏感和情感冲击，表现沙皇军队的镇压和民众的愤怒。平行蒙太奇如《教父》中洗礼与暗杀场景的交叉剪辑，形成对比，增强戏剧张力。" }
                    ]}
                ]
            },

            "影视视听语言模拟卷01": {
                course: "视听语言",
                sections: [
                    { key: "single", label: "一、单项选择题（共20题）", questions: [
                        { t: "在35mm电影摄影中，被认为是\"标准镜头\"，其透视关系最接近人眼视觉感受的焦距范围是【】", o: ["A.20mm以下","B.20-40mm","C.40-50mm","D.50mm以上"], a: "C.40-50mm" },
                        { t: "能够压缩空间的纵深感，使前后景仿佛\"贴\"在一起，让人物从环境中凸显出来的镜头是【】", o: ["A.短焦距镜头","B.标准焦距镜头","C.长焦距镜头","D.变焦镜头"], a: "C.长焦距镜头" },
                        { t: "下列景别中，最适合于表现人物面部细微表情、传达人物内心活动的是【】", o: ["A.远景","B.全景","C.中景","D.特写"], a: "D.特写" },
                        { t: "摄影机镜头处于与被摄对象水平位置的拍摄角度是【】", o: ["A.俯拍","B.仰拍","C.平角","D.斜角"], a: "C.平角" },
                        { t: "在色环上处于180度相对位置，能够产生最强烈视觉对比的色彩组合是【】", o: ["A.近似色","B.互补色","C.三色和谐","D.单色和谐"], a: "B.互补色" },
                        { t: "旨在创造连贯、流畅的时空幻觉，使观众沉浸于故事而忘记剪辑存在的剪辑形式是【】", o: ["A.苏联蒙太奇","B.经典剪辑","C.风格化剪辑","D.匹配的剪辑"], a: "B.经典剪辑" },
                        { t: "在对话场景中，为了保持空间关系的统一和观众的方向感，应遵循的基本原则是【】", o: ["A.三角形机位法则","B.跳切原则","C.声画对位原则","D.色彩匹配原则"], a: "A.三角形机位法则" },
                        { t: "爱森斯坦蒙太奇理论的核心是强调镜头与镜头之间的【】", o: ["A.和平共处","B.连接与叙事","C.冲突与碰撞","D.相似性积累"], a: "C.冲突与碰撞" },
                        { t: "主要声源不在画面内，但作为背景音效与画内场景产生联系，这种声画关系是【】", o: ["A.声画同步","B.声画分离","C.声画对位","D.声画措置"], a: "B.声画分离" },
                        { t: "人物超越叙事时空的内心声音，以第一人称在非叙事时空里对事件进行评述，这属于【】", o: ["A.旁白","B.解说词","C.内心独白","D.对白"], a: "C.内心独白" },
                        { t: "用仰拍角度把人物拍摄得很高大、垂直感加强，这种手法属于视听语言的哪种修辞功能？【】", o: ["A.强调","B.渲染","C.视觉隐喻","D.劝说"], a: "C.视觉隐喻" },
                        { t: "让观众的视点与人物视点产生同一感，从而使观众认同主人公的叙事手段是【】", o: ["A.理性蒙太奇","B.视点缝合","C.声画对位","D.风格化剪辑"], a: "B.视点缝合" },
                        { t: "下列哪种镜头最能体现时空的完整统一，具有强烈的纪实性？【】", o: ["A.固定镜头","B.运动镜头","C.长镜头","D.变焦镜头"], a: "C.长镜头" },
                        { t: "模拟剧中人物主观视点，让观众产生身临其境感的跟拍方式是【】", o: ["A.前跟","B.后跟","C.侧跟","D.斜跟"], a: "B.后跟" },
                        { t: "摄影机机位不变，通过变动镜头光学轴线的拍摄方法称为【】", o: ["A.推镜头","B.拉镜头","C.摇镜头","D.移镜头"], a: "C.摇镜头" },
                        { t: "画面和声音不是按照现实逻辑配合，而是情绪、调子相反，这种声画关系是【】", o: ["A.声画同步","B.声画分离","C.声画对位","D.声画措置"], a: "C.声画对位" },
                        { t: "在电影中，突然的\"无声\"（静场）处理，通常是为了【】", o: ["A.节省制作成本","B.强调某个时刻的心理冲击","C.表示设备故障","D.延长影片时间"], a: "B.强调某个时刻的心理冲击" },
                        { t: "重复蒙太奇将相似镜头剪辑在一起，其主要目的是【】", o: ["A.推进叙事","B.营造气氛","C.创造新的思想","D.实现转场"], a: "B.营造气氛" },
                        { t: "场面调度的核心是处理【】", o: ["A.演员的表演","B.摄影机的运动","C.演员与摄影机的关系","D.场景的布置"], a: "C.演员与摄影机的关系" },
                        { t: "能够最有效地引导观众视线，使其与剧中人物视线合一的构图方法是利用【】", o: ["A.色彩对比","B.动静对比","C.视线优势","D.画中框对比"], a: "C.视线优势" }
                    ]},
                    { key: "multi", label: "二、多项选择题（共5题）", questions: [
                        { t: "以下哪些是景别的主要功能？【】", o: ["A.描绘电影空间","B.建立情感距离","C.控制影片时长","D.建构视觉风格","E.改变画面色彩"], a: "A、B、D" },
                        { t: "下列哪些属于经典剪辑为了保持连续性而遵循的匹配原则？【】", o: ["A.动作的匹配","B.视线的匹配","C.色彩的匹配","D.概念的匹配","E.音乐的匹配"], a: "A、B、C" },
                        { t: "电影声音的叙事功能主要体现在【】", o: ["A.确立场景的情绪和气氛","B.创造地点感和时代感","C.揭示人物内心世界","D.直接控制画面色彩","E.改变镜头焦距"], a: "A、B、C" },
                        { t: "实现\"强调\"功能的视听语言手段包括【】", o: ["A.运用景别和焦点控制","B.运用视觉元素或情节的重复编码","C.运用反讽","D.运用理性蒙太奇","E.运用大远景镜头"], a: "A、B、C" },
                        { t: "关于固定镜头，下列说法正确的是【】", o: ["A.是静态构图的单个镜头","B.只有人物调度变化，没有摄影机参与","C.完全不改变基本构图形式","D.是一种缺乏表现力的镜头形式","E.常用于表现稳定的主观视点"], a: "A、B、C" }
                    ]},
                    { key: "name", label: "三、名词解释（共5题）", questions: [
                        { t: "景深", a: "指在摄影机镜头前沿能够清晰成像的空间深度范围。景深范围受焦距、光圈和物距影响。" },
                        { t: "场面调度", a: "原为戏剧术语，在电影中指导演对画框内一切视觉元素（演员、场景、灯光等）的组织和安排，以及摄影机与被摄主体之间的运动关系。" },
                        { t: "轴线原则", a: "指在拍摄一组相关镜头时，摄影机机位应被限制在一条假想的关系轴线（如对话线或运动线）的同一侧180度范围内，以保持空间统一感和方向感。" },
                        { t: "声画对位", a: "指声音与画面在情绪、节奏、氛围或内涵上形成对比、对立或差异性的关系，通过这种\"不和谐\"产生超越画面或声音本身的新寓意。" },
                        { t: "视觉隐喻", a: "指用画面造型语言（如景别、角度、光影、色彩、构图）使视觉形象具有影片规定情境中的特殊象征含义，是将抽象概念具象化的修辞手段。" }
                    ]},
                    { key: "short", label: "四、简答题（共3题）", questions: [
                        { t: "简述景别在影视叙事中的三种主要意义。", a: "①描绘电影空间：展示环境、规模及人物与环境的关系。②建立情感距离：控制观众与人物之间的心理距离（如特写让人亲近，远景让人疏远）。③建构视觉风格：导演对景别的偏好和使用方式是形成其独特视觉风格的重要组成部分。" },
                        { t: "简述剪辑工作的三个基本内容。", a: "①镜头的取舍：决定使用哪些镜头，舍弃哪些镜头。②确定镜头的长度：控制每个镜头的持续时间，从而控制影片的节奏。③选择剪辑点：在哪个精确的时刻进行镜头切换，以保证动作、情绪或节奏的连贯。" },
                        { t: "简述实现视觉隐喻的两种主要方式。", a: "①对画面内的视觉元素进行造型：运用景别、角度、光影、色彩、构图等造型语言，在单个画面或镜头内使形象具有特别的隐喻意味。②在整部作品的结构中重复编码：使某个视觉意象在影片中反复出现，其象征意义不断被强化和累积，最终成为一个贯穿全片的隐喻系统。" }
                    ]},
                    { key: "essay", label: "五、论述题（共2题）", questions: [
                        { t: "结合具体影片案例，论述长镜头的美学特征及其与蒙太奇在哲学基础和表现功能上的根本区别。", a: "长镜头美学特征：时空完整性、纪实性、多义性（尊重生活的暧昧）。通过演员与摄影机的复杂调度在一个镜头内完成叙事段落。案例：如《好家伙》中进入夜总会的长镜头，一气呵成地展现了空间、塑造了人物。哲学基础区别：长镜头美学深受巴赞\"纪实美学\"影响，相信\"影像与被摄物同一\"，追求现实的完整性。蒙太奇（尤其苏联学派）则相信意义产生于镜头的组合与冲突，是创造性的、主观的。表现功能区别：长镜头引导观众观察和选择，思考画面内的含义。蒙太奇则引导观众联想和思考，理解镜头之间的概念。" },
                        { t: "试论声音在电影中是如何帮助解放摄影机，扩展画面外空间，并营造整体氛围的。请结合实例说明。", a: "解放摄影机，扩展画外空间：通过\"声画分离\"实现。画外声音（如门外脚步声、街外车流声）暗示了一个存在于画框之外的、持续运作的完整空间，使摄影机不必事无巨细地展现所有内容。案例：《大红灯笼高高挂》中画外的捶脚声、对话声，暗示了院落重重的空间和权力关系。营造整体氛围：音响（环境声、动作音响）营造空间真实感和特定情绪；音乐直接抒发感情、确立场景基调；人声对白传递信息，语气语调塑造人物性格；无声（静场）通过突然的静默强调心理冲击。案例：《拯救大兵瑞恩》登陆段落的音响设计，营造了极度混乱和残酷的战场氛围。" }
                    ]},
                    { key: "essay", label: "六、分析应用题（共1题）", questions: [
                        { t: "请选择一部你熟悉的影片（如《肖申克的救赎》《霸王别姬》《社交网络》或一部你印象深刻的作品），从画面造型语言、镜头形式、剪辑风格、声音与声画关系这四个角度中任选三个，结合具体片段，分析其视听语言是如何有效地服务于影片整体叙事和主题表达的。", a: "以《肖申克的救赎》为例：\n1.画面造型语言：色彩与色调——大部分采用冷灰调渲染监狱压抑，安迪逃出后画面转为暖色象征自由；光线——监狱内顶光侧光形成浓重阴影，表现禁锢；构图上大量使用封闭式构图，铁窗、门框框住人物，表达禁锢感。\n2.镜头形式：固定镜头和长镜头居多，营造时间停滞感；景别运用中景、全景表现群体管理，特写在安迪坚持希望时出现，强调内心。\n3.声音与声画关系：音乐——莫扎特歌剧声画对位，成为精神自由的象征；音响——铁门声、镣铐声构建森严的听觉监狱，雨声、雷声在越狱时外化狂喜；旁白以瑞德第一人称贯穿，点明主题。\n总结：通过冷峻的画面造型、沉稳的镜头语言和富有象征意味的声音设计，完美地服务和深化了“希望”与“自由”的主题。" }
                    ]}
                ]
            },

            // ---- 电脑动画（1套） ----
            "电脑动画模拟题1": {
                course: "电脑动画",
                sections: [
                    { key: "single", label: "一、单项选择题（共16题）", questions: [
                        { t: "被认为是动画本体的缔造者人物是（）", o: ["A.麦凯","B.普拉托","C.帕瑞斯","D.埃米尔·雷诺"], a: "D.埃米尔·雷诺", p: "作为动画本体缔造者，埃米尔·雷诺的重大突破和贡献基于他自身的科学精神和艺术天赋。" },
                        { t: "电影史上首部剧情动画长片是（）", o: ["A.小丑可可","B.墨水瓶人","C.白雪公主和七个小矮人","D.骷髅舞"], a: "C.白雪公主和七个小矮人", p: "电影史上首部长篇剧情动画片《白雪公主和七个小矮人》的问世不仅稳固了迪士尼的名声，更是他对待艺术创作严谨认真的态度以及精良的工艺技术的全面展示。" },
                        { t: "1892年10月28日雷诺在葛莱凡蜡像馆放映的第一组光学哑剧动画片是（）", o: ["A.《小丑和他的狗》《相对论》《一种好啤酒》","B.《一种好啤酒》《斜线交响曲》《光习乐曲1号》","C.《可怜的皮耶罗》《小鸟入笼》《小丑和他的狗》","D.《小丑和他的狗》《可怜的皮耶罗》《一种好啤酒》"], a: "D.《小丑和他的狗》《可怜的皮耶罗》《一种好啤酒》", p: "1892年10月28日，雷诺在葛莱凡蜡像馆放映他的第一组光学哑剧动画片《小丑和他的狗》、《可怜的皮耶罗》和《一种好啤酒》。" },
                        { t: "把《色彩韵律》设计图做成动画，不相关的是（）", o: ["A.叙尔瓦奇","B.理查德","C.罗特曼","D.伊格林"], a: "A.叙尔瓦奇", p: "早在1912年，抽象画家雷欧普·叙尔瓦奇就希望把自己关于《色彩韵律》的设计图做成动画，他的愿望不久后在画家汉斯·理查德、沃特·罗特曼和维京·伊格林等人的作品中得以实现。" },
                        { t: "以下作为温瑟·麦凯的代表作的是（）", o: ["A.《幻影集》","B.《恐龙葛蒂》","C.《闹鬼的旅店》","D.《滑稽面孔》"], a: "B.《恐龙葛蒂》", p: "1914年，麦凯推出代表作《恐龙葛蒂》。" },
                        { t: "世界上最早从事具象实验动画创作的艺术家代表人物，不包括的是（）", o: ["A.洛特·雷妮格","B.贝特霍尔德·巴托施","C.汉斯·理查德","D.亚历山大·阿雷克塞耶夫"], a: "C.汉斯·理查德", p: "具象实验动画代表人物有洛特·雷妮格、贝特霍尔德·巴托施和亚历山大·阿雷克塞耶夫。" },
                        { t: "商业动画诞生地是（）", o: ["A.日本","B.英国","C.美国","D.中国"], a: "C.美国" },
                        { t: "以下选项中，属于日本动画的是（）", o: ["A.《哪吒闹海》","B.《铁扇公主》","C.《大闹天宫》","D.《白娘子传说》"], a: "D.《白娘子传说》", p: "安日田在1958年拍摄了第一部长篇动画《白娘子的传说》，取材于中国的《白蛇传》。" },
                        { t: "成为电视首播的迪士尼早期动画片是（）", o: ["A.《史酷比》","B.《哈克狗》","C.《拉和莱迪》","D.《唐纳的外甥古斯》"], a: "D.《唐纳的外甥古斯》", p: "迪士尼早期的动画片《唐纳的外甥古斯》成为在电视上首播的动画片。" },
                        { t: "由佛莱雪发明的是（）", o: ["A.旋转透镜","B.幻盘","C.诡盘","D.走马灯"], a: "A.旋转透镜", p: "马克斯·佛莱雪发明了旋转透镜。" },
                        { t: "撰写世界上第一本具有专业理论特点的动画教科书《动画电影技术》的作者是（）", o: ["A.埃米尔·雷诺","B.温瑟·麦凯","C.约翰·哈拉斯","D.约翰·A·帕瑞斯"], a: "C.约翰·哈拉斯", p: "约翰·哈拉斯撰写了世界上第一本具有专业理论特点的动画教科书。" },
                        { t: "以下动画中，采用了水墨形式的是（）", o: ["A.《草原小姐妹》","B.《大闹天宫》","C.《大耳朵图图》","D.《山水情》"], a: "D.《山水情》" },
                        { t: "德国动画家泰伦·蒙哥马利以作品（）获得第69届奥斯卡最佳动画短片奖", o: ["A.《原野之歌》","B.《玻璃和声》","C.《雪人》","D.《追寻》"], a: "D.《追寻》", p: "泰伦·蒙哥马利的作品《追寻》获得第69届奥斯卡最佳动画短片奖。" },
                        { t: "捷克斯洛伐克画家杰里·川卡在（）中将木偶、旧照及约瑟夫·拉达的著名插图结合", o: ["A.《乌苏比尔历险记》","B.《难忘的蒙娜丽莎》","C.《好兵帅克》","D.《捷克年》"], a: "C.《好兵帅克》", p: "他在《好兵帅克》中将木偶、旧照片以及约瑟夫·拉达的著名插图结合在一起。" },
                        { t: "动画片中常见的曲线运动包括弧形运动、S形运动和", o: ["A.圆形运动","B.Z形运动","C.循环运动","D.波形运动"], a: "D.波形运动", p: "常见的曲线运动包括弧形运动、“S”形运动和波形运动。" },
                        { t: "代表作《滑稽面孔》的电影特效师兼摄影师是（）", o: ["A.詹姆斯·斯图尔特·布莱克顿","B.埃米尔·雷诺","C.温瑟·麦凯","D.约翰·A·帕瑞斯"], a: "A.詹姆斯·斯图尔特·布莱克顿", p: "詹姆斯·斯图尔特·布莱克顿创作了《滑稽面孔》。" }
                    ]},
                    { key: "fill", label: "二、填空题（共5题）", questions: [
                        { t: "动画生产机制中，前期文案包括文学剧本、故事大纲、故事梗概、文字分镜、形象素材以及__________等。", a: "生产进度表" },
                        { t: "被誉为中国动画的开山人物是__________。", a: "万氏兄弟" },
                        { t: "《小鸭呷呷》就是我国的一部__________动画片。", a: "折纸偶" },
                        { t: "1872年，雷诺根据“运动物体视觉暂留”发现，设计的装置叫__________。", a: "活动视频" },
                        { t: "动画《铁臂阿童木》的创作者是__________。", a: "手冢治虫" }
                    ]},
                    { key: "name", label: "三、名词解释（共4题）", questions: [
                        { t: "萨格勒布学派", a: "1955年在南斯拉夫的萨格勒布市出现了动画新学派。几位杰出的动画艺术家受美国联合制作公司的启迪和西方某些绘画风格的影响，结合自己对艺术的思考和独特想象力，创作出具有时代特色的实验动画片，三位杰出的代表人物是瓦特罗斯拉夫·米米卡、尼克拉·科斯特拉克和杜桑·伏科维克。" },
                        { t: "画面分镜", a: "画面分镜是用画面配文字表现的分镜头剧本，是动画导演对未来影片的设计蓝图。" },
                        { t: "故事梗概", a: "故事梗概精炼叙述故事脚本的核心内容和重要情节，按照电影蒙太奇思维模式写作。通常以场景为描述单元，主要围绕五个因素展开：什么事、事件的主体、在什么地方、什么时间以及为什么，要求文字简练，场次与段落线索分明。" },
                        { t: "场景结构图", a: "场景结构图对动画故事的表现至关重要，导演的视点和角色的动作需要在一个假定的时空环境才能进行合理调度。场景结构图是故事的视觉变化逻辑依据，也是镜头画面的衡量尺度。" }
                    ]},
                    { key: "short", label: "四、简答题（共5题）", questions: [
                        { t: "简述计算机三维动画的特点。", a: "①高度的真实感；②强大的表现力；③可编辑性强；④精确的运动控制；⑤多视角展示；⑥便于与其他媒体融合；⑦高效的制作流程；⑧可重复性和可扩展性。" },
                        { t: "简述动画的功能属性。", a: "①信息传播功能；②娱乐功能；③教育功能；④艺术审美功能；⑤情感表达功能；⑥商业营销功能。" },
                        { t: "简述质素中的“造型符号素”。", a: "造型符号素是质素的一种类型。它是在艺术创作和审美体验中，具有特定造型特征和表意功能的符号元素。造型符号素可以是具体的图形、线条、色彩等视觉元素，它们通过组合、排列等方式构成艺术作品的形式结构，并传达出特定的意义和情感。" },
                        { t: "单线平涂的优势。", a: "线条简洁明确，能突出物体轮廓，使画面具有清晰的视觉效果；上色过程相对简单直接，节省时间和精力；风格独特，具有很强的装饰性，能营造出简洁、明快的艺术氛围；便于修改和调整。" },
                        { t: "计算机动画的特性。", a: "①虚拟性；②可编辑性；③重复性；④交互性；⑤高效性；⑥多样性；⑦易于传播。" }
                    ]},
                    { key: "essay", label: "五、论述题（共2题）", questions: [
                        { t: "简述文字分镜的定义与作用。", a: "文字分镜是一种以文字形式详细描述影视、动画等作品内容和画面的脚本。它将故事按照情节发展顺序，逐段描述每个镜头的景别、画面内容、台词、时长、拍摄地点等信息。其作用主要包括：①规划创作；②沟通协作；③预算控制；④提高效率。" },
                        { t: "创造性还原有哪些要点。", a: "要点：第一，一个镜头中速度的变化是吸引观众的看点。第二，要认识停顿的价值，逗留时间是动画表现技巧的关键。第三，主体动作持续停顿时，增加个别细节变化的微妙动作能够表现动画特有的美和艺术感染力。第四，每张动画之间的距离通常要维持到活动形象本身体积的三分之一重叠，重叠面积越大，动作运动越细腻流畅。第五，运动轨迹要强调起伏变化和透视关系，动画师要保持距离渐变的韵律感。" }
                    ]}
                ]
            },

            // ---- 数字影像设计与制作（3套） ----
            "数字影像设计与制作模拟试卷（一）": {
                course: "数字影像设计与制作",
                sections: [
                    { key: "single", label: "一、单项选择题（共10题）", questions: [
                        { t: "数字摄影的核心感光元件是（ ）", o: ["A.胶片","B.CCD或CMOS","C.光学透镜","D.反光镜"], a: "B.CCD或CMOS" },
                        { t: "下列哪种格式具有最大的后期调整空间？（ ）", o: ["A.JPG","B.TIFF","C.RAW","D.BMP"], a: "C.RAW" },
                        { t: "非线性编辑软件的特点是（ ）", o: ["A.必须按时间顺序剪辑","B.可任意截取拼接片段","C.只能处理图片","D.不支持声音"], a: "B.可任意截取拼接片段" },
                        { t: "光位中，逆光的主要作用是（ ）", o: ["A.均匀照亮主体","B.勾勒轮廓","C.减少阴影","D.增加色彩饱和度"], a: "B.勾勒轮廓" },
                        { t: "光圈越大，景深（ ）", o: ["A.越大","B.越小","C.不变","D.与光圈无关"], a: "B.越小" },
                        { t: "白平衡校正的目的是（ ）", o: ["A.调整亮度","B.还原白色","C.改变对比度","D.增加锐度"], a: "B.还原白色" },
                        { t: "测光模式中，点测光适用于（ ）", o: ["A.大范围风景","B.逆光人像","C.夜间城市","D.雪地拍摄"], a: "B.逆光人像" },
                        { t: "曝光补偿中，拍摄大面积白色场景时应（ ）", o: ["A.增加曝光补偿","B.减少曝光补偿","C.不调整","D.使用闪光灯"], a: "A.增加曝光补偿" },
                        { t: "电影起源的基础是（ ）", o: ["A.单张照片","B.连续静态画面结合放映","C.数字合成","D.动画绘制"], a: "B.连续静态画面结合放映" },

        // ============================================================
        // 状态管理（新增 originalQuestions 保存初始顺序）
        // ============================================================
        var state = {
            currentPaperName: '',
            questions: [],
            originalQuestions: [], // 保存加载时的初始顺序
            selected: {},
            userInput: {},
            submitted: {},
            correct: {},
            ansVisible: {}
        };

        // ============================================================
        // 工具函数
        // ============================================================
        function flattenQuestions(paper) {
            var flat = [];
            paper.sections.forEach(function(sec) {
                sec.questions.forEach(function(q, idx) {
                    flat.push({
                        id: sec.key + '_' + idx,
                        secKey: sec.key,
                        sectionLabel: sec.label,
                        text: q.t,
                        options: q.o || null,
                        answer: q.a,
                        parse: q.p || null,
                        isSubjective: !q.o,
                        isFillBlank: q.t && (q.t.includes('__________') || q.t.includes('____')),
                        type: sec.key
                    });
                });
            });
            return flat;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function getCorrectIndices(q) {
            if (!q.options) return [];
            var ansStr = q.answer.trim();
            var letters = ansStr.match(/[A-Z]/g);
            if (!letters) return [];
            var indices = [];
            letters.forEach(function(letter) {
                for (var i = 0; i < q.options.length; i++) {
                    var opt = q.options[i].trim();
                    if (opt.charAt(0).toUpperCase() === letter.toUpperCase()) {
                        indices.push(i);
                        break;
                    }
                }
            });
            return indices;
        }

        function isSingleChoice(q) {
            return q.type === 'single';
        }

        // ============================================================
        // 渲染函数（不变）
        // ============================================================
        function render() {
            var container = document.getElementById('questionsContainer');
            var html = '';
            var total = state.questions.length;
            var shown = 0;
            for (var key in state.ansVisible) {
                if (state.ansVisible[key]) shown++;
            }

            document.getElementById('totalQ').textContent = total;
            document.getElementById('totalQTop').textContent = total;
            document.getElementById('footerTotal').textContent = total;
            document.getElementById('shownQ').textContent = shown;
            document.getElementById('shownQTop').textContent = shown;

            if (total === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#6a7b8c;">请选择一套试卷</div>';
                return;
            }

            var sections = {};
            state.questions.forEach(function(q) {
                if (!sections[q.secKey]) {
                    sections[q.secKey] = { label: q.sectionLabel, questions: [] };
                }
                sections[q.secKey].questions.push(q);
            });

            for (var secKey in sections) {
                var sec = sections[secKey];
                html += '<div class="sec">';
                html += '<div class="sec-title">' + sec.label + ' <span class="cnt">' + sec.questions.length + ' 题</span></div>';
                sec.questions.forEach(function(q, idx) {
                    var qid = q.id;
                    var isSubj = q.isSubjective;
                    var selectedIndices = state.selected[qid] || [];
                    var inputVal = state.userInput[qid] || '';
                    var submitted = state.submitted[qid] || false;
                    var correct = state.correct[qid] || false;
                    var ansVisible = state.ansVisible[qid] || false;

                    var correctIndices = [];
                    if (!isSubj) correctIndices = getCorrectIndices(q);

                    html += '<div class="q" data-qid="' + qid + '">';
                    html += '<div class="qh"><span class="ql">' + (idx + 1) + '.</span><span class="qt">' + q.text + '</span></div>';

                    if (!isSubj) {
                        html += '<div class="opts">';
                        q.options.forEach(function(opt, oi) {
                            var cls = 'opt';
                            if (selectedIndices.indexOf(oi) !== -1) {
                                cls += ' sel';
                                if (submitted) {
                                    if (correctIndices.indexOf(oi) !== -1) cls += ' cor';
                                    else cls += ' wrg';
                                }
                            }
                            html += '<span class="' + cls + '" data-qid="' + qid + '" data-oi="' + oi + '">' + opt + '</span>';
                        });
                        html += '</div>';

                        html += '<div class="qact">';
                        html += '<button class="btn-toggle" data-qid="' + qid + '">' + (ansVisible ? '隐藏答案' : '显示答案') + '</button>';
                        if (!isSingleChoice(q)) {
                            html += '<button class="btn-submit" data-qid="' + qid + '">提交答案</button>';
                        }
                        html += '</div>';
                    } else {
                        html += '<div class="si">';
                        if (q.isFillBlank) {
                            html += '<input type="text" class="subj-input" data-qid="' + qid + '" placeholder="请输入填空内容..." value="' + escapeHtml(inputVal) + '">';
                        } else {
                            html += '<textarea class="subj-input" data-qid="' + qid + '" placeholder="请输入你的答案...">' + escapeHtml(inputVal) + '</textarea>';
                        }
                        html += '<div class="btn-row-2">';
                        html += '<button class="ta" data-qid="' + qid + '">' + (ansVisible ? '隐藏答案' : '显示答案') + '</button>';
                        html += '<button class="sub" data-qid="' + qid + '">提交答案</button>';
                        html += '</div>';
                        html += '</div>';
                    }

                    html += '<div class="ansbox' + (ansVisible ? ' show' : '') + (submitted && !correct ? ' wrong' : '') + '">';
                    html += '<div class="al">参考答案';
                    if (submitted) {
                        html += '<span class="rt ' + (correct ? 'ok' : 'fail') + '">' + (correct ? '回答正确' : '回答错误') + '</span>';
                    }
                    html += '</div>';
                    html += '<div>' + q.answer + '</div>';
                    if (q.parse) {
                        html += '<div class="parse"><strong>解析：</strong>' + q.parse + '</div>';
                    }
                    html += '</div>';

                    html += '</div>';
                });
                html += '</div>';
            }

            container.innerHTML = html;

            // ---- 事件绑定 ----
            container.querySelectorAll('.opts .opt').forEach(function(el) {
                el.addEventListener('click', function() {
                    var qid = this.dataset.qid;
                    var oi = parseInt(this.dataset.oi);
                    handleOptionClick(qid, oi);
                });
            });

            container.querySelectorAll('.qact .btn-toggle').forEach(function(el) {
                el.addEventListener('click', function() {
                    var qid = this.dataset.qid;
                    toggleAnswer(qid);
                });
            });

            container.querySelectorAll('.qact .btn-submit').forEach(function(el) {
                el.addEventListener('click', function() {
                    var qid = this.dataset.qid;
                    handleSubmitChoice(qid);
                });
            });

            container.querySelectorAll('.subj-input').forEach(function(el) {
                el.addEventListener('input', function() {
                    var qid = this.dataset.qid;
                    state.userInput[qid] = this.value;
                    if (state.submitted[qid]) {
                        state.submitted[qid] = false;
                        state.correct[qid] = false;
                        state.ansVisible[qid] = false;
                        render();
                    }
                });
            });

            container.querySelectorAll('.si .ta').forEach(function(el) {
                el.addEventListener('click', function() {
                    var qid = this.dataset.qid;
                    toggleAnswer(qid);
                });
            });

            container.querySelectorAll('.si .sub').forEach(function(el) {
                el.addEventListener('click', function() {
                    var qid = this.dataset.qid;
                    handleSubmitSubjective(qid);
                });
            });
        }

        // ============================================================
        // 交互函数
        // ============================================================
        function handleOptionClick(qid, oi) {
            var q = state.questions.find(function(item) { return item.id === qid; });
            if (!q || q.isSubjective) return;

            if (isSingleChoice(q)) {
                state.selected[qid] = [oi];
                var correctIndices = getCorrectIndices(q);
                var isCorrect = (correctIndices.length === 1 && correctIndices[0] === oi);
                state.submitted[qid] = true;
                state.correct[qid] = isCorrect;
                state.ansVisible[qid] = true;
                render();
                return;
            }

            if (state.submitted[qid]) {
                state.submitted[qid] = false;
                state.correct[qid] = false;
                state.ansVisible[qid] = false;
            }
            var arr = state.selected[qid] || [];
            var idx = arr.indexOf(oi);
            if (idx === -1) arr.push(oi);
            else arr.splice(idx, 1);
            if (arr.length === 0) delete state.selected[qid];
            else state.selected[qid] = arr;
            render();
        }

        function toggleAnswer(qid) {
            state.ansVisible[qid] = !state.ansVisible[qid];
            render();
        }

        function handleSubmitChoice(qid) {
            var q = state.questions.find(function(item) { return item.id === qid; });
            if (!q || q.isSubjective || isSingleChoice(q)) return;
            var selectedIndices = state.selected[qid] || [];
            if (selectedIndices.length === 0) {
                alert('请至少选择一个选项！');
                return;
            }
            var correctIndices = getCorrectIndices(q);
            var sortedSel = selectedIndices.slice().sort();
            var sortedCor = correctIndices.slice().sort();
            var isCorrect = (sortedSel.length === sortedCor.length) &&
                            sortedSel.every(function(v, i) { return v === sortedCor[i]; });
            state.submitted[qid] = true;
            state.correct[qid] = isCorrect;
            state.ansVisible[qid] = true;
            render();
        }

        function handleSubmitSubjective(qid) {
            var q = state.questions.find(function(item) { return item.id === qid; });
            if (!q || !q.isSubjective) return;
            var userAns = state.userInput[qid] || '';
            if (!userAns.trim()) {
                alert('请先输入答案！');
                return;
            }
            var expected = q.answer.replace(/\s/g, '').toLowerCase();
            var actual = userAns.replace(/\s/g, '').toLowerCase();
            var isCorrect = false;
            if (expected.includes('；') || expected.includes(';')) {
                var parts = expected.split(/[；;]/).map(function(s) { return s.trim(); });
                var userParts = actual.split(/[；;]/).map(function(s) { return s.trim(); });
                var allMatch = true;
                if (parts.length !== userParts.length) allMatch = false;
                else {
                    for (var i = 0; i < parts.length; i++) {
                        if (parts[i] !== userParts[i]) { allMatch = false; break; }
                    }
                }
                isCorrect = allMatch;
            } else {
                isCorrect = (actual === expected);
            }
            state.submitted[qid] = true;
            state.correct[qid] = isCorrect;
            state.ansVisible[qid] = true;
            render();
        }

        // ============================================================
        // 左侧按钮功能
        // ============================================================
        function toggleAllAnswers() {
            var allVisible = true;
            for (var key in state.ansVisible) {
                if (!state.ansVisible[key]) { allVisible = false; break; }
            }
            var newVal = !allVisible;
            state.questions.forEach(function(q) {
                state.ansVisible[q.id] = newVal;
            });
            render();
        }

        function shuffleQuestions() {
            // 打乱当前 state.questions 顺序
            var arr = state.questions;
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = arr[i];
                arr[i] = arr[j];
                arr[j] = temp;
            }
            render();
        }

        function resetAll() {
            // 重置所有交互状态
            state.selected = {};
            state.userInput = {};
            state.submitted = {};
            state.correct = {};
            state.ansVisible = {};
            // 恢复题目顺序为初始顺序（深拷贝）
            state.questions = state.originalQuestions.slice();
            render();
        }

        function randomQuestion() {
            var total = state.questions.length;
            if (total === 0) return;
            var idx = Math.floor(Math.random() * total);
            var qid = state.questions[idx].id;
            var el = document.querySelector('.q[data-qid="' + qid + '"]');
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.style.transition = 'background 0.3s';
                el.style.background = '#d4e4f7';
                setTimeout(function() { el.style.background = ''; }, 1500);
            }
        }

        function clearAllInputs() {
            for (var qid in state.userInput) {
                state.userInput[qid] = '';
            }
            for (var qid in state.submitted) {
                state.submitted[qid] = false;
                state.correct[qid] = false;
                state.ansVisible[qid] = false;
            }
            render();
        }

        // ============================================================
        // 课程与试卷联动逻辑
        // ============================================================
        function populateCourseSelect() {
            var courseSelect = document.getElementById('courseSelect');
            var courses = [];
            var paperKeys = Object.keys(allPapers);
            paperKeys.forEach(function(key) {
                var course = allPapers[key].course;
                if (course && courses.indexOf(course) === -1) {
                    courses.push(course);
                }
            });
            courses.sort();
            courseSelect.innerHTML = '';
            courses.forEach(function(course) {
                var opt = document.createElement('option');
                opt.value = course;
                opt.textContent = course;
                courseSelect.appendChild(opt);
            });
            if (courses.length > 0) {
                courseSelect.value = courses[0];
                updatePaperSelect(courses[0]);
            }
        }

        function updatePaperSelect(course) {
            var paperSelect = document.getElementById('paperSelect');
            var paperNames = [];
            for (var key in allPapers) {
                if (allPapers[key].course === course) {
                    paperNames.push(key);
                }
            }
            paperNames.sort();
            paperSelect.innerHTML = '';
            paperNames.forEach(function(name) {
                var opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                paperSelect.appendChild(opt);
            });
            if (paperNames.length > 0) {
                paperSelect.value = paperNames[0];
                loadPaper(paperNames[0]);
            } else {
                state.questions = [];
                state.originalQuestions = [];
                state.selected = {};
                state.userInput = {};
                state.submitted = {};
                state.correct = {};
                state.ansVisible = {};
                document.getElementById('paperNameDisplay').textContent = '无试卷';
                document.getElementById('paperTitle').textContent = '无试卷';
                render();
            }
        }

        // ============================================================
        // 加载试卷（同时保存原始顺序）
        // ============================================================
        function loadPaper(paperName) {
            if (!allPapers[paperName]) return;
            state.currentPaperName = paperName;
            var flat = flattenQuestions(allPapers[paperName]);
            state.questions = flat;
            state.originalQuestions = flat.slice(); // 保存初始顺序
            state.selected = {};
            state.userInput = {};
            state.submitted = {};
            state.correct = {};
            state.ansVisible = {};
            document.getElementById('paperNameDisplay').textContent = paperName;
            document.getElementById('paperTitle').textContent = paperName;
            render();
        }

        // ============================================================
        // 绑定事件
        // ============================================================
        document.getElementById('courseSelect').addEventListener('change', function() {
            var course = this.value;
            updatePaperSelect(course);
        });

        document.getElementById('paperSelect').addEventListener('change', function() {
            loadPaper(this.value);
        });

        document.getElementById('btnToggleAns').addEventListener('click', toggleAllAnswers);
        document.getElementById('btnShuffle').addEventListener('click', shuffleQuestions);
        document.getElementById('btnReset').addEventListener('click', resetAll);
        document.getElementById('btnRandom').addEventListener('click', randomQuestion);
        document.getElementById('btnClear').addEventListener('click', clearAllInputs);

        // ============================================================
        // 页面初始化
        // ============================================================
        window.onload = function() {
            populateCourseSelect();
        };
    </script>
</body>
</html>
