<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>艺术概论 · 背诵复习系统</title>
<style>
:root{
  --bg:#fffdf6;
  --panel:#fffef9;
  --card:#ffffff;
  --text:#2b2416;
  --muted:#8d8168;
  --accent:#f5b301;
  --accent-2:#ffd85e;
  --accent-strong:#a17400;
  --accent-soft:#fff4cf;
  --border:#f1e4bd;
  --green:#2e9e5b;
  --red:#d9534f;
  --shadow:0 2px 10px rgba(180,150,60,.10);
  --shadow-hover:0 6px 20px rgba(180,150,60,.18);
}
html[data-theme="dark"]{
  --bg:#14120c;
  --panel:#1b1810;
  --card:#211d13;
  --text:#eae1cb;
  --muted:#9c9179;
  --accent:#e8b416;
  --accent-2:#c99b10;
  --accent-strong:#f0c33c;
  --accent-soft:#322a14;
  --border:#332c18;
  --green:#4bbf7a;
  --red:#e06c6c;
  --shadow:0 2px 12px rgba(0,0,0,.55);
  --shadow-hover:0 6px 22px rgba(0,0,0,.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  height:100dvh;
  padding-top:70px;
  transition:background .3s ease,color .3s ease;
  -webkit-font-smoothing:antialiased;
}

/* ============ 顶栏 ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:70px;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 8px rgba(0,0,0,.04);
  transition:background .3s ease,border-color .3s ease;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{
  width:32px;height:32px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 2px 9px rgba(245,179,1,.5);
}
.brand h1{
  margin:0;font-size:32px;font-weight:900;letter-spacing:.8px;
  line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tools{display:flex;align-items:center;gap:7px;flex:none}
.tool{
  width:40px;height:40px;border-radius:11px;cursor:pointer;
  border:1px solid var(--border);
  background:var(--card);color:var(--muted);
  display:grid;place-items:center;
  transition:all .18s ease;
  padding:0;
}
.tool:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);transform:translateY(-1px)}
.tool:active{transform:scale(.93)}
.tool.active{background:var(--accent);border-color:var(--accent);color:#2b2416;box-shadow:0 3px 10px rgba(245,179,1,.45)}
.tool svg{width:20px;height:20px;display:block}

/* ============ 布局 ============ */
.layout{
  display:flex;
  height:100%;
  overflow:hidden;
}

/* ============ 左侧固定题型栏 ============ */
.sidebar{
  width:216px;flex:none;
  background:var(--panel);
  border-right:1px solid var(--border);
  padding:18px 14px;
  display:flex;flex-direction:column;gap:16px;
  overflow-y:auto;
  transition:background .3s ease,border-color .3s ease;
}
.side-title{
  font-size:11px;font-weight:900;letter-spacing:2.5px;
  color:var(--muted);margin-bottom:10px;
}
.filters{display:flex;flex-direction:column;gap:8px}
.chip{
  width:100%;
  display:flex;align-items:center;gap:9px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  padding:10px 12px;border-radius:11px;
  font-size:13.5px;font-weight:700;
  cursor:pointer;transition:all .18s ease;font-family:inherit;text-align:left;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45;flex:none;transition:all .18s}
.chip:hover{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
.chip.active{
  background:var(--accent);color:#2b2416;border-color:var(--accent);
  box-shadow:0 3px 10px rgba(245,179,1,.35);
}
.chip.active .dot{opacity:1;background:#2b2416}
.chip-count{
  margin-left:auto;font-size:11px;font-weight:800;
  background:rgba(0,0,0,.055);color:inherit;
  border-radius:6px;padding:1px 7px;opacity:.8;
}
.chip.active .chip-count{background:rgba(43,36,22,.14);opacity:1}

.side-divider{height:1px;background:var(--border);flex:none}

.side-info{display:flex;flex-direction:column;gap:11px;font-size:12px;color:var(--muted);font-weight:600}
#statText{font-weight:800;color:var(--accent-strong);font-size:12.5px;letter-spacing:.3px}
.legend{display:flex;flex-direction:column;gap:7px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}

/* ============ 右侧题目滚动区 ============ */
main{
  flex:1;min-width:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:18px 22px 80px;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
main::-webkit-scrollbar{width:9px}
main::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
main::-webkit-scrollbar-thumb:hover{background:var(--accent)}
main::-webkit-scrollbar-track{background:transparent}

.list-wrap{max-width:880px;margin:0 auto}

/* ============ 卡片 ============ */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-left:5px solid var(--accent);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:border-color .22s ease,box-shadow .22s ease,background .22s ease;
  animation:fadeIn .28s ease both;
}
.card:hover{box-shadow:var(--shadow-hover)}
.card.seen{
  border-left-color:var(--green);
  background:linear-gradient(90deg,rgba(46,158,91,.055),transparent 62%);
}
html[data-theme="dark"] .card.seen{
  background:linear-gradient(90deg,rgba(75,191,122,.09),transparent 62%);
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.num{
  display:inline-grid;place-items:center;min-width:26px;height:23px;padding:0 7px;
  border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);
  font-size:12px;font-weight:800;letter-spacing:.3px;
}
.badge{
  font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;
  border:1px solid transparent;letter-spacing:.5px;
}
.badge.choice{color:#a17400;background:#fff8e4;border-color:#f0d79b}
.badge.fill{color:#1f7a46;background:#eefaf3;border-color:#bfe6cf}
.badge.term{color:#5b46a8;background:#f4f1fd;border-color:#d5ccf2}
html[data-theme="dark"] .badge.choice{color:#f0c33c;background:#2e2712;border-color:#4a3f1c}
html[data-theme="dark"] .badge.fill{color:#6fd49a;background:#122a1d;border-color:#254a34}
html[data-theme="dark"] .badge.term{color:#b9a6f5;background:#1d1830;border-color:#372c5c}
.chapter{font-size:11px;color:var(--muted);font-weight:700}

.stem{
  font-size:15px;line-height:1.7;font-weight:600;
  word-break:break-word;
}
.stem.term-stem{font-size:16.5px;font-weight:800;letter-spacing:.5px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:10px 12px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.55;font-family:inherit;font-weight:500;
  cursor:pointer;transition:all .15s ease;
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{
  flex:none;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;font-size:11.5px;font-weight:800;
  background:var(--accent-soft);color:var(--accent-strong);transition:all .15s ease;
}
.opt.correct{border-color:var(--green);background:rgba(46,158,91,.11)}
.opt.correct .key{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:rgba(217,83,79,.11)}
.opt.wrong .key{background:var(--red);color:#fff}

.answer{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:none}
.card.open .answer{display:block;animation:fadeDown .2s ease}
@keyframes fadeDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.ans-label{
  font-size:11px;font-weight:900;color:var(--accent-strong);
  letter-spacing:3px;margin-bottom:7px;
}
.ans-body{
  font-size:14px;line-height:1.8;color:var(--text);
  white-space:pre-wrap;word-break:break-word;
}

.empty{
  text-align:center;color:var(--muted);font-size:14px;
  padding:60px 20px;font-weight:600;
}

/* ============ Toast ============ */
.toast{
  position:fixed;left:50%;bottom:34px;z-index:2000;
  transform:translateX(-50%) translateY(14px);
  background:var(--accent);color:#2b2416;
  font-size:13px;font-weight:800;letter-spacing:.6px;
  padding:10px 20px;border-radius:999px;
  box-shadow:0 8px 26px rgba(245,179,1,.5);
  opacity:0;pointer-events:none;
  transition:opacity .28s ease,transform .28s ease;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 响应式：窄屏左侧栏变顶部横向 ============ */
@media (max-width:760px){
  body{padding-top:64px}
  .topbar{height:64px;padding:0 10px;gap:8px}
  .brand{gap:9px}
  .brand h1{font-size:26px;letter-spacing:.4px}
  .brand .mark{width:27px;height:27px;border-radius:9px}
  .tools{gap:6px}
  .tool{width:36px;height:36px;border-radius:10px}
  .tool svg{width:18px;height:18px}

  .layout{flex-direction:column}
  .sidebar{
    width:100%;flex:none;
    flex-direction:row;align-items:center;gap:10px;
    padding:9px 12px;
    border-right:none;border-bottom:1px solid var(--border);
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;
  }
  .sidebar::-webkit-scrollbar{display:none}
  .side-title{display:none}
  .filters{flex-direction:row;flex:1 1 auto;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .filters::-webkit-scrollbar{display:none}
  .chip{width:auto;flex:none;padding:7px 13px;border-radius:999px;font-size:12.5px;gap:6px}
  .chip .dot{width:7px;height:7px}
  .chip-count{display:none}
  .side-divider{display:none}
  .side-info{flex:none;flex-direction:row;align-items:center;gap:8px;font-size:11px}
  #statText{font-size:11.5px;white-space:nowrap}
  .legend{display:none}

  main{padding:12px 10px 50px}
  .stem{font-size:14.2px}
  .stem.term-stem{font-size:15.2px}
  .opt{font-size:13.4px;padding:9px 10px}
  .card{padding:13px 13px;border-radius:12px}
}
@media (max-width:440px){
  .brand h1{font-size:21px}
  .brand .mark{width:23px;height:23px;border-radius:8px}
  .tools{gap:4px}
  .tool{width:31px;height:31px;border-radius:9px}
  .tool svg{width:16px;height:16px}
}
@media (max-width:380px){
  .brand h1{font-size:17px;max-width:130px}
  .tools{gap:3px}
  .tool{width:29px;height:29px;border-radius:8px}
  .tool svg{width:15px;height:15px}
}
</style>
</head>
<body>

<!-- ================= 顶栏 ================= -->
<header class="topbar">
  <div class="brand">
    <div class="mark"></div>
    <h1>艺术概论</h1>
  </div>
  <div class="tools">
    <!-- 打乱顺序 -->
    <button class="tool" id="btnShuffle" title="重置题目顺序（含选项打乱）" aria-label="重置题目顺序">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>
      </svg>
    </button>
    <!-- 恢复顺序 -->
    <button class="tool" id="btnRestore" title="恢复题目顺序" aria-label="恢复题目顺序">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/>
        <circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <!-- 显示/关闭全部答案 -->
    <button class="tool" id="btnToggleAll" title="显示/关闭全部答案" aria-label="显示或关闭全部答案">
      <svg id="iconEye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <!-- 日间/夜间 -->
    <button class="tool" id="btnTheme" title="日间/夜间切换（夜间护眼）" aria-label="切换日间夜间模式">
      <svg id="iconTheme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <!-- 重置全部状态 -->
    <button class="tool" id="btnResetAll" title="重置全部状态" aria-label="重置全部状态">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>
</header>

<!-- ================= 左右布局 ================= -->
<div class="layout">

  <!-- 左侧固定题型栏 -->
  <aside class="sidebar">
    <div>
      <div class="side-title">题型筛选</div>
      <div class="filters" id="filters">
        <button class="chip active" data-f="all"><span class="dot"></span><span>全部</span><span class="chip-count" data-count="all">0</span></button>
        <button class="chip" data-f="choice"><span class="dot"></span><span>选择题</span><span class="chip-count" data-count="choice">0</span></button>
        <button class="chip" data-f="fill"><span class="dot"></span><span>填空题</span><span class="chip-count" data-count="fill">0</span></button>
        <button class="chip" data-f="term"><span class="dot"></span><span>名词解释</span><span class="chip-count" data-count="term">0</span></button>
      </div>
    </div>
    <div class="side-divider"></div>
    <div class="side-info">
      <div id="statText">—</div>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>未看</span>
        <span><i style="background:var(--green)"></i>已看</span>
      </div>
    </div>
  </aside>

  <!-- 右侧可滑动题目区 -->
  <main id="main">
    <div class="list-wrap" id="list"></div>
  </main>

</div>

<script>
/* ==========================================================
   题库数据
   t: choice 选择题 / fill 填空题 / term 名词解释
   c: 章节   q: 题干   o: 选项   a: 答案(选择为索引)   e: 解析
   ========================================================== */
const Q = [

/* ==================== 第一章 导论 ==================== */
{t:'choice',c:'第一章',q:'18世纪欧洲出现“美的艺术”观念，由夏尔·巴托在哪部著作中明确界定？',o:['《归结为同一原理的美的艺术》','《判断力批判》','《美学讲演录》','《论品味的标准》'],a:0,e:'夏尔·巴托在《归结为同一原理的美的艺术》中明确界定了“美的艺术”，包括诗歌、音乐、舞蹈、绘画、雕塑等。'},
{t:'choice',c:'第一章',q:'欧洲古代的“自由艺术”不包括下列哪一项？',o:['文法','逻辑','医学','天文'],a:2,e:'“自由艺术”包括文法、逻辑、修辞、算术、几何、天文和音律七种学问，现代指大学本科的通识教育。'},
{t:'choice',c:'第一章',q:'以下不属于中国古代“六艺”的是？',o:['礼','乐','射','诗'],a:3,e:'中国“六艺”指礼、乐、射、御、书、数。'},
{t:'choice',c:'第一章',q:'康德认为艺术家是“天才”，凭灵感创造，不同于？',o:['依规则生产的工匠','宫廷画师','民间艺人','学院教授'],a:0,e:'康德认为艺术家是“天才”，凭灵感创造，不同于依规则生产的工匠。'},
{t:'choice',c:'第一章',q:'提出“灵感说”、认为知识本源神秘的古希腊哲学家是？',o:['亚里士多德','柏拉图','苏格拉底','毕达哥拉斯'],a:1,e:'亚里士多德从“技艺”和“摹仿”看待艺术；柏拉图提出“灵感说”。'},
{t:'choice',c:'第一章',q:'中国古代艺术分类中，“宫廷艺术”即？',o:['文人艺术','庙堂的艺术','民间艺术','宗教艺术'],a:1,e:'中国古代艺术分为宫廷艺术、文人艺术、宗教艺术、民间艺术；宫廷艺术即庙堂的艺术。'},
{t:'choice',c:'第一章',q:'“审美”一词源于康德的哪一概念？',o:['纯粹理性','感性判断','实践理性','先验直观'],a:1,e:'“审美”源于康德《判断力批判》中的“感性判断”，其“纯粹感性判断”即今之审美判断。'},
{t:'choice',c:'第一章',q:'“aesthetic”（美学）一词由鲍姆加登根据哪种语言新造？',o:['拉丁文','古希腊文','古希伯来文','古埃及文'],a:1,e:'鲍姆加登根据古希腊文新造“aesthetic”一词。'},
{t:'choice',c:'第一章',q:'中国非物质文化遗产分为十类，其中直接属于文学艺术的有几类？',o:['五类','六类','七类','八类'],a:2,e:'十类中七类直接为文学艺术，其余相关。'},
{t:'choice',c:'第一章',q:'我国于哪一年加入《保护非物质文化遗产公约》？',o:['2001年','2003年','2004年','2006年'],a:2,e:'2003年通过公约，我国2004年加入。'},
{t:'choice',c:'第一章',q:'1972年《保护世界文化和自然遗产公约》将遗产分为？',o:['物质遗产与非物质遗产','自然遗产与文化遗产','可移动与不可移动','历史建筑与考古遗址'],a:1,e:'1972年公约将遗产分为自然遗产与文化遗产。'},

/* ==================== 名词解释 ==================== */
{t:'term',c:'第一章',q:'美的艺术',a:'18世纪欧洲出现的艺术观念，由夏尔·巴托在《归结为同一原理的美的艺术》中明确界定，包括诗歌、音乐、舞蹈、绘画、雕塑等。它标志着现代艺术观念的形成，把艺术与一般技艺区分开来。'},
{t:'term',c:'第一章',q:'自由艺术',a:'欧洲古代的“自由艺术”包括文法、逻辑、修辞、算术、几何、天文和音律七种学问，建立在“劳心”与“劳力”的社会等级区分上，现代指大学本科的通识教育。'},
{t:'term',c:'第一章',q:'机械艺术',a:'欧洲古代与“自由艺术”相对，被视为奴隶的艺术，涉及生产劳动和谋生技艺，社会地位低下。'},
{t:'term',c:'第一章',q:'庙堂的艺术',a:'古代文明的重要物质遗存多来自庙堂的艺术（如金字塔、神庙、青铜器、宫廷绘画），又称礼仪的艺术。从马克思主义视角看，它是统治阶级意识形态的物化呈现，也是劳动人民智慧的结晶。'},
{t:'term',c:'第一章',q:'审美判断',a:'源于康德《判断力批判》中的“感性判断”。康德将其分为不纯粹与纯粹两种，“纯粹感性判断”即今之审美判断，强调其超功利性。'},
{t:'term',c:'第一章',q:'非物质文化遗产',a:'2003年《保护非物质文化遗产公约》定义为：社区、群体视为文化遗产的实践、观念、表现形式、知识、技能及相关工具、实物。又称“活遗产”“活传统”，我国2004年加入公约。中国非遗分十类，实行四级名录制。'},
{t:'term',c:'第一章',q:'物质文化遗产',a:'包括历史建筑、考古遗址、可移动文物三大类，是艺术史考察的重要对象。'},
{t:'term',c:'第一章',q:'艺术门类',a:'如美术、音乐、舞蹈及其细分方式，缘起于欧洲18世纪的“美的艺术”体系。现代艺术体制形成了艺术院校（美院、音院）、展示场所（美术馆、音乐厅）等分类。'},
{t:'term',c:'第三章',q:'白立方',a:'指四壁洁白、独立纯净的美术馆展览空间，由布莱恩·奥多尔蒂提出。对“白立方”的不满催生了试图逃离美术馆的前卫艺术，如大地艺术、在地艺术。'},
{t:'term',c:'第三章',q:'大地艺术',a:'在大自然中创作的艺术，如罗伯特·史密森在盐湖堆建的螺旋堤。它是对“白立方”不满而产生的、走出美术馆的艺术。'},
{t:'term',c:'第三章',q:'前卫艺术（先锋艺术）',a:'挑战现存社会体制或艺术体制，具有批判性、思想性、创新性的艺术。如拒绝官方沙龙展的现实主义和印象派、意大利未来派、达达主义、波普艺术、班克西等。'},
{t:'term',c:'第三章',q:'接受美学',a:'由德国汉斯·罗伯特·姚斯（康斯坦茨学派）在20世纪60年代提出，将文艺研究重心从作者/艺术家转向读者/接受者，强调接受是使艺术成为艺术的终端环节。'},
{t:'term',c:'第三章',q:'艺术体制',a:'艺术现代化过程中，生产、分配、接受环节出现体制化倾向（专业人才培养机构、展示场所、销售渠道、传播渠道等），形成标准化的现代艺术体制。它加强艺术自律、促进繁荣，但也拉开艺术与生活的距离、造成全球趋同。'},
{t:'term',c:'第三章',q:'产业链',a:'围绕某类产品形成的产供销全流程的企业分工协作体系，分为上游、中游、下游。上游最具渠道优势，利润和附加值最高。'},
{t:'term',c:'第三章',q:'一级市场与二级市场',a:'一级市场指通过经纪人和中介机构出售；二级市场指通过拍卖行等代理机构进行二手交易，版权交易也是一种二级市场。'},
{t:'term',c:'第三章',q:'赞助人',a:'如文艺复兴时期欧洲的教皇、美第奇家族等，他们支付报酬且尊重大师。赞助精神在西方延续，受法律鼓励（如慈善捐赠抵税），专业化基金会对当代艺术发展起重要作用。'},
{t:'term',c:'第三章',q:'收藏家',a:'希望尽可能多地收藏好作品，远超个人需要。大藏家热衷研究、藏品成体系（可构成艺术史专题）、不愿拆散出售，最好的归宿是将藏品捐赠给美术馆/博物馆，永久保存并向公众开放。'},
{t:'term',c:'第三章',q:'发烧友',a:'指达到一定专业水平的痴迷爱好者，词源香港，初指音响爱好者。随着生活水平提升，大众文化需求出现分层，产生各式发烧友圈层。'},
{t:'term',c:'第四章',q:'造物艺术',a:'以物质生产为主，以材料和工艺为手段，主要满足物质生活需求的艺术，如实用器皿、家具。'},
{t:'term',c:'第四章',q:'表意艺术',a:'以讲故事、传情达意为主，以语言声调、姿势为媒介，主要满足精神娱乐需求的艺术，如木雕玉雕摆件、绣画、年画等只能被观看的品类。'},
{t:'term',c:'第四章',q:'装饰艺术',a:'在实用产品表面附着图画、图案等表意成分，如建筑构件上的雕刻。它是介于造物与表意之间的混合艺术。'},
{t:'term',c:'第四章',q:'一元艺术本体论',a:'以往的美学和艺术理论（再现论、想象论、表现论、形式主义、意境说、意象说等）大多建立在表意艺术的基础上，认为所有的艺术都以表意的方式存在。在一元论框架下，工艺美术、实用美术、装饰艺术始终被认为低于纯艺术。'},
{t:'term',c:'第四章',q:'第四堵墙',a:'由狄德罗提出：舞台朝向观众的一侧有一堵透明的墙，演员应假装看不到观众，完全沉浸、逼真表演。它与绘画的透视理论类似，旨在制造一个与生活分离的平行世界；布莱希特提出打破它。'},
{t:'term',c:'第四章',q:'跨媒介叙事',a:'一个故事从一种艺术媒介向另一种艺术媒介转化、新生的过程，如语言→文字/书籍、语言→舞台/演员、语言→材料/工艺。故事不仅被重述，更被不同艺术手段重新塑造。'},
{t:'term',c:'第四章',q:'非遗的“事”“事中之物”“事后之物”',a:'非遗不是“非物质”的，而是由“事”（生活语境）、“事中之物”（如织布、绣花的产品）和“事后之物”共同构成。这类活动不脱离原有的“事”而存在。'},
{t:'term',c:'第四章',q:'技近乎道',a:'源自老庄思想，指手工艺技能出自长期与材料、工艺打交道的经验，这种经验是具体的、难以概括为普遍规则，技能是身心合一的、难以与人分离，需师徒口传心授并在实践中践行。'},
{t:'term',c:'第四章',q:'材美工巧',a:'手工艺原则，指材料美、工艺巧。许多原材料初取时并不美，需经挑选和加工才成良材美质，如高档木材、玉料。'},
{t:'term',c:'第四章',q:'模件化生产',a:'用模具批量制造相同产品和零件，如秦始皇兵马俑（雷德侯《万物》所述）。这并非中国独有，欧洲古代手工业也使用模具，现代工业生产的模件化是从传统手工业中发展出来的。'},
{t:'term',c:'第五章',q:'第一媒介与第二媒介',a:'表意艺术的媒介分为两个层次：第一媒介是物质性的（如颜料、石材）；第二媒介是精神性的，是第一媒介作用于感官后在心灵中形成的成像（如色彩、体量感）。第二媒介是表意艺术直接的表达手段。'},
{t:'term',c:'第五章',q:'媒介化',a:'材料和身体长期服务于某种表意活动后，成为一种专门化的物质手段，获得专属的媒介特性。'},
{t:'term',c:'第五章',q:'艺术形象',a:'内容与形式融合的结果。广义指艺术作品形成的整体面貌（表征或表象）；狭义指艺术内容层中可作为最小意义单元的“形象”，如独立角色、道具形象、经典场景构图、装饰纹样等。'},
{t:'term',c:'第五章',q:'题材与主题',a:'题材指作品表现的对象或范围（如风景、人体）；主题是作品的中心思想、主旨、立意，是隐藏在题材背后的深层思想。如王安石《泊船瓜洲》题材为江南风光，主题为以天下为己任的壮志雄心。'},
{t:'term',c:'第五章',q:'图像志与图像学',a:'潘诺夫斯基图像学分析的两层：图像志辨识作品内容；图像学对内容及形式进行社会文化分析，探究来源成因。'},
{t:'term',c:'第五章',q:'再设计',a:'原研哉提出，回到设计的原点，重新审视日常用品，以平易近人的方式探索设计的本质，“将已知的事物陌生化，更是一种创造”。'},
{t:'term',c:'第六章',q:'现代性',a:'现代化的结果，也是现代社会区别于传统社会的特性，可分为经济现代性、政治现代性、文化现代性、生活现代性等层面。'},
{t:'term',c:'第六章',q:'现代化',a:'以工业化和城市化为核心驱动，在经济、政治、思想、文化艺术和日常生活层面造成一系列后果，使得现代社会全方位区别于传统社会。'},
{t:'term',c:'第六章',q:'工具理性',a:'法兰克福学派在韦伯基础上提出（又称技术理性），是一种以绩效为唯一目标的理性行为，表现为量化的计算和精确的控制。'},
{t:'term',c:'第六章',q:'机器美学',a:'一战前后流行，歌颂机器，追随机器精神进行创作。意大利未来派是早期代表，包豪斯/呼捷玛斯的机器美学与手工艺运动的手工艺美学构成反题。'},
{t:'term',c:'第六章',q:'现成品',a:'非为艺术而制的人工制品。杜尚将现成物整个地转化为反艺术的作品，而非艺术媒材，与传统决裂，启迪了“任何东西都可成为艺术媒介”。'},
{t:'term',c:'第六章',q:'拼贴',a:'由布拉克和毕加索1912年首创，将现成图像（被挪用的图片、文字）拼贴入作品。早期仍服务于绘画。'},
{t:'term',c:'第六章',q:'超现实主义',a:'源自达达主义，以巴黎为中心。布勒东1924年发表《超现实主义宣言》，以弗洛伊德精神分析学为理论基础，核心方法是潜意识创作、自动写作。代表艺术家有恩斯特、达利。'},
{t:'term',c:'第六章',q:'后工业社会',a:'丹尼尔·贝尔理论：后工业社会主要矛盾是人与人竞争，核心资源是信息，是高科技社会、信息社会。'},
{t:'term',c:'第六章',q:'景观社会',a:'居伊·德波提出，是对“外观”的消费。'},
{t:'term',c:'第六章',q:'符号价值',a:'让·鲍德里亚提出：人们消费的不是物的使用价值，而是物的符号价值。'},
{t:'term',c:'第六章',q:'日常生活的审美化',a:'迈克·费瑟斯通概括的后现代社会特征，也称“日常生活的殖民化”。'},
{t:'term',c:'第六章',q:'观念艺术',a:'泛指各种观念化的当代艺术（与特定流派“概念艺术”区别），核心是作品的思想性和主题性，带有反思性和批判性。如概念艺术、女性主义艺术。'},
{t:'term',c:'第六章',q:'关系艺术（社会参与式艺术）',a:'尼古拉斯·伯瑞奥德《关系美学》提出，通过项目实施影响社会关系和社区环境，常无物质产品。'},
{t:'term',c:'第六章',q:'在地艺术',a:'针对特定的社会空间和生活环境进行创作，通过介入式项目改善原有的空间和人际关系。成果可能是公共雕塑、壁画，但更多是综合性的社会实践项目，参与城市更新和乡村振兴。'},
{t:'term',c:'第七章',q:'公共艺术',a:'指在公共空间中面向公众创作的艺术。新中国十大建筑及其装饰可视为早期公共艺术，1998年教育部将其列为本科专业，现在越来越强调“在地性”。'},
{t:'term',c:'第七章',q:'审美教育（美育）',a:'源于德文，本义为感性教育。席勒第一个系统提出，著有《审美教育书简》。审美教育是形而上的理想与目标，艺术教育是形而下的手段与路径；美育具有现代性，面向全体公民。'},
{t:'term',c:'第七章',q:'公共文化服务',a:'国家基本公共服务，免费或优惠向公民提供。2005年提出公共文化服务体系建设，2015年提出现代化构建，2016年通过《公共文化服务保障法》，2021年印发《关于推动公共文化服务高质量发展的意见》。'},
{t:'term',c:'第七章',q:'艺术乡建',a:'以艺术介入乡村建设，改善环境、提升文化气息。如渠岩在山西许村、广东青田，欧宁与左靖在安徽碧山的“碧山共同体计划”，中国美术学院成立美丽中国研究院推动艺术乡建。'},
{t:'term',c:'第七章',q:'三大体系',a:'习近平总书记提出构建中国特色哲学社会科学学科体系、学术体系、话语体系。中国艺术学应继承典籍、物质文化遗产、非物质文化遗产三类传统，立足当代、赓续传统。'},
{t:'term',c:'第三章',q:'艺术传播',a:'艺术本身具有沟通和传播功能。传播渠道和媒介主要影响艺术的分配和接受环节，并可能反作用于艺术，催生新的艺术形式（如电影从记录新闻和讲故事发展出纪录片和故事片）。'}
];

/* ==========================================================
   状态与逻辑
   ========================================================== */
const TYPE_NAME = {choice:'选择题', fill:'填空题', term:'名词解释'};
const LETTERS = 'ABCDEFGH';

const state = {
  order: [],
  optOrder: {},
  openSet: new Set(),
  filter: 'all',
  theme: 'light'
};

const $ = (s)=>document.querySelector(s);
const listEl = $('#list');
const mainEl = $('#main');
const statText = $('#statText');
const btnEye = $('#btnToggleAll');
const btnTheme = $('#btnTheme');
const iconEye = $('#iconEye');
const iconTheme = $('#iconTheme');

const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
const EYE_CLOSED = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
const ICON_SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

/* ---------- Toast ---------- */
let toastTimer = null;
function showToast(msg){
  let el = document.querySelector('.toast');
  if(!el){
    el = document.createElement('div');
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1400);
}

/* ---------- 初始化顺序 ---------- */
function initOrder(){
  state.order = Q.map((_,i)=>i);
  state.optOrder = {};
  Q.forEach((q,i)=>{
    if(q.t === 'choice') state.optOrder[i] = q.o.map((_,k)=>k);
  });
}

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/* ---------- 题型数量徽章 ---------- */
function updateCounts(){
  const counts = {all:Q.length, choice:0, fill:0, term:0};
  Q.forEach(q=>{ counts[q.t] = (counts[q.t]||0) + 1; });
  document.querySelectorAll('[data-count]').forEach(el=>{
    el.textContent = counts[el.dataset.count] || 0;
  });
}

/* ---------- 渲染 ---------- */
function render(){
  listEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  let shown = 0, seen = 0;

  state.order.forEach((qi)=>{
    const q = Q[qi];
    if(state.filter !== 'all' && q.t !== state.filter) return;
    shown++;
    if(state.openSet.has(qi)) seen++;
    frag.appendChild(buildCard(qi, q, shown));
  });

  if(shown === 0){
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '暂无题目';
    frag.appendChild(d);
  }
  listEl.appendChild(frag);

  statText.textContent = `共 ${shown} 题 · 已看 ${seen}`;
  syncEyeIcon();
}

function buildCard(qi, q, num){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.qi = qi;
  if(state.openSet.has(qi)) card.classList.add('open','seen');

  /* 头部 */
  const head = document.createElement('div');
  head.className = 'card-head';
  const numEl = document.createElement('span');
  numEl.className = 'num';
  numEl.textContent = num;
  const badge = document.createElement('span');
  badge.className = 'badge ' + q.t;
  badge.textContent = TYPE_NAME[q.t];
  const ch = document.createElement('span');
  ch.className = 'chapter';
  ch.textContent = q.c;
  head.appendChild(numEl);
  head.appendChild(badge);
  head.appendChild(ch);
  card.appendChild(head);

  /* 题干 */
  const stem = document.createElement('div');
  stem.className = 'stem' + (q.t === 'term' ? ' term-stem' : '');
  stem.textContent = q.q;
  card.appendChild(stem);

  /* 选项 */
  if(q.t === 'choice'){
    const opts = document.createElement('div');
    opts.className = 'opts';
    const ord = state.optOrder[qi] || q.o.map((_,k)=>k);
    ord.forEach((oi, k)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.dataset.oi = oi;
      const key = document.createElement('span');
      key.className = 'key';
      key.textContent = LETTERS[k];
      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = q.o[oi];
      b.appendChild(key);
      b.appendChild(txt);
      b.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        chooseOption(card, opts, qi, q, oi);
      });
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }

  /* 答案 */
  const ans = document.createElement('div');
  ans.className = 'answer';
  const lab = document.createElement('div');
  lab.className = 'ans-label';
  lab.textContent = '答案';
  const body = document.createElement('div');
  body.className = 'ans-body';
  if(q.t === 'choice'){
    body.textContent = '正确答案：' + q.o[q.a] + (q.e ? '\n\n' + q.e : '');
  }else{
    body.textContent = q.a;
  }
  ans.appendChild(lab);
  ans.appendChild(body);
  card.appendChild(ans);

  /* 点击展开 / 收起 */
  card.addEventListener('click', ()=>{
    if(card.classList.contains('open')){
      card.classList.remove('open');
      state.openSet.delete(qi);
    }else{
      card.classList.add('open','seen');
      state.openSet.add(qi);
    }
    updateStats();
  });

  return card;
}

/* ---------- 选择选项 ---------- */
function chooseOption(card, optsEl, qi, q, oi){
  const opts = optsEl.querySelectorAll('.opt');
  opts.forEach(o=>o.classList.remove('correct','wrong'));
  if(oi === q.a){
    opts.forEach(o=>{ if(+o.dataset.oi === q.a) o.classList.add('correct'); });
  }else{
    opts.forEach(o=>{
      if(+o.dataset.oi === oi) o.classList.add('wrong');
      if(+o.dataset.oi === q.a) o.classList.add('correct');
    });
  }
  card.classList.add('open','seen');
  state.openSet.add(qi);
  updateStats();
}

/* ---------- 统计 ---------- */
function updateStats(){
  let shown = 0, seen = 0;
  state.order.forEach(qi=>{
    const q = Q[qi];
    if(state.filter !== 'all' && q.t !== state.filter) return;
    shown++;
    if(state.openSet.has(qi)) seen++;
  });
  statText.textContent = `共 ${shown} 题 · 已看 ${seen}`;
  syncEyeIcon();
}

/* ---------- 眼睛图标状态 ---------- */
function syncEyeIcon(){
  const visible = state.order.filter(qi => state.filter==='all' || Q[qi].t === state.filter);
  const allOpen = visible.length > 0 && visible.every(qi => state.openSet.has(qi));
  iconEye.innerHTML = allOpen ? EYE_CLOSED : EYE_OPEN;
  btnEye.classList.toggle('active', allOpen);
}

/* ---------- 回到顶部 ---------- */
function scrollTopSmooth(){
  mainEl.scrollTo({top:0, behavior:'smooth'});
}

/* ==========================================================
   顶部按钮事件
   ========================================================== */

/* 1. 重置题目顺序（题目与选项一起打乱） */
$('#btnShuffle').addEventListener('click', ()=>{
  shuffleArr(state.order);
  Object.keys(state.optOrder).forEach(k=>{
    shuffleArr(state.optOrder[k]);
  });
  render();
  scrollTopSmooth();
  showToast('已打乱题目与选项顺序');
});

/* 2. 恢复题目顺序 */
$('#btnRestore').addEventListener('click', ()=>{
  initOrder();
  render();
  scrollTopSmooth();
  showToast('已恢复题目顺序');
});

/* 3. 显示 / 关闭全部答案 */
btnEye.addEventListener('click', ()=>{
  const visible = state.order.filter(qi => state.filter==='all' || Q[qi].t === state.filter);
  const allOpen = visible.length > 0 && visible.every(qi => state.openSet.has(qi));
  if(allOpen){
    visible.forEach(qi=>state.openSet.delete(qi));
    showToast('已关闭全部答案');
  }else{
    visible.forEach(qi=>state.openSet.add(qi));
    showToast('已显示全部答案');
  }
  render();
});

/* 4. 日间 / 夜间切换 */
btnTheme.addEventListener('click', ()=>{
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  iconTheme.innerHTML = state.theme === 'dark' ? ICON_SUN : ICON_MOON;
  btnTheme.classList.toggle('active', state.theme === 'dark');
  showToast(state.theme === 'dark' ? '已切换至夜间护眼模式' : '已切换至日间模式');
});

/* 5. 重置全部状态 */
$('#btnResetAll').addEventListener('click', ()=>{
  /* 顺序与选项恢复 */
  initOrder();
  /* 清空已看 / 答案展开状态 */
  state.openSet.clear();
  /* 题型筛选回到全部 */
  state.filter = 'all';
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('active', c.dataset.f === 'all');
  });
  /* 主题回到日间 */
  state.theme = 'light';
  document.documentElement.setAttribute('data-theme','light');
  iconTheme.innerHTML = ICON_MOON;
  btnTheme.classList.remove('active');
  /* 重绘 */
  render();
  scrollTopSmooth();
  showToast('已重置页面');
});

/* ---------- 题型筛选 ---------- */
$('#filters').addEventListener('click', (e)=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  state.filter = btn.dataset.f;
  render();
  scrollTopSmooth();
});

/* ---------- 启动 ---------- */
initOrder();
updateCounts();
render();
</script>
</body>
</html>
